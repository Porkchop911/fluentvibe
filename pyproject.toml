[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluentvibe"
version = "0.1.0"
description = "Stateful object-model framework for authoring Tecan FluentControl protocols in Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "lxml>=5,<6",
  "langchain-core>=1.2,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "pytest>=8,<9",
]

[project.scripts]
fluentvibe = "fluentvibe.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
fluentvibe = [
  "_assets/templates/*.xml",
  "_assets/reference/*.yaml",
  "_assets/reference/*.txt",
  "_assets/config/*.yaml",
  "catalog/*.db",
]

[tool.setuptools.packages.find]
include = ["fluentvibe*"]

[tool.pytest.ini_options]
markers = [
  "live_lm: requires LM Studio at the configured authoring endpoint",
  "fluentcontrol_shell: requires a running FluentControl UI and shell XSCR",
]
